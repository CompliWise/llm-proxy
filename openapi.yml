openapi: 3.0.0
info:
  title: LLM Proxy
  description: Contract surface for llm-proxy liveness and operational health.
  version: 1.0.0
servers:
  - url: https://ai-gateway.dev.compliwise.io
paths:
  /health:
    get:
      summary: Health check with provider and circuit breaker status
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, providers]
                properties:
                  status:
                    type: string
                    enum: [healthy]
                  timestbamp:
                    type: integer
                  providers:
                    type: object
                    additionalProperties: true
                  features:
                    type: object
                    additionalProperties:
                      type: boolean
                  circuit_breaker:
                    type: object
                    additionalProperties: true
    head:
      summary: Health probe (no body)
      operationId: headHealth
      responses:
        "200":
          description: Service is healthy
