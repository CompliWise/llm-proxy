# CompliWise production overlay — merged after base.yml and production.yml
# Activate with LLM_PROXY_CONFIG_PROFILE=compliwise-production

features:
  cost_tracking:
    enabled: true
    async: true
  rate_limiting:
    enabled: true
    backend: redis
  circuit_breaker:
    enabled: true
    backend: redis
  pii_redact:
    enabled: true
    # Presidio analyzer is deployed on the gateway VM (2026-09-08). Fail CLOSED —
    # never send PII to the upstream LLM; if Presidio is unreachable the request
    # 503s rather than leaking (strict compliance, per Murshid on PR #2).
    fail_mode: "closed"
  admin_dashboard:
    enabled: true
  history:
    backend: local
    streams: [cost, pii, usage, ratelimit]

providers:
  openai:
    enabled: true
  anthropic:
    enabled: true
  gemini:
    enabled: true
  bedrock:
    enabled: false
